<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Modern Ashram</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  @font-face { font-family: "Work Sans Local"; src: url("assets/fonts/WorkSans-VariableFont_wght.ttf") format("truetype"); font-weight: 100 900; font-style: normal; }
  @font-face { font-family: "Gloock Local"; src: url("assets/fonts/Gloock-Regular.ttf") format("truetype"); font-weight: 400; font-style: normal; }

  :root {
    --c-deep-teal:    #1F3136;
    --c-forest-green: #547063;
    --c-cream:        #FFFBFB;
    --font-display:   "Gloock", "Gloock Local", Georgia, serif;
    --font-body:      "Work Sans", "Work Sans Local", system-ui, sans-serif;
    --radius-btn:     8px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--c-cream);
    font-family: var(--font-body);
    color: var(--c-deep-teal);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 24px;
    text-align: center;
  }

  .welcome-eyebrow {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(30px, 4vw, 48px);
    line-height: 1.1;
    letter-spacing: -0.01em;
    margin-bottom: clamp(60px, 8vw, 110px);
  }

  .welcome-logo {
    width: clamp(200px, 28vw, 360px);
    height: auto;
    margin-bottom: clamp(60px, 8vw, 110px);
    display: block;
  }

  .welcome-cta {
    background: linear-gradient(270deg, var(--c-forest-green) 0%, var(--c-deep-teal) 100%);
    color: #fff;
    border-radius: var(--radius-btn);
    padding: 12px 40px;
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 16px;
    line-height: 1.4;
    text-decoration: none;
    transition: opacity 0.2s, transform 0.1s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .welcome-cta:hover  { opacity: 0.88; }
  .welcome-cta:active { transform: scale(0.98); }
  .welcome-cta:focus-visible { outline: 2px solid var(--c-forest-green); outline-offset: 4px; }

  @media (max-width: 767px) {
    body { padding: 48px 24px; }
    .welcome-eyebrow { font-size: 28px; margin-bottom: 60px; }
    .welcome-logo    { width: 220px; margin-bottom: 60px; }
    .welcome-cta     { padding: 10px 32px; font-size: 14px; }
  }
</style>
</head>
<body>

  <h1 class="welcome-eyebrow">Welcome to</h1>

  <img src="assets/images/The Modern Ashram TOP NAV LOGO.svg"
       alt="The Modern Ashram"
       class="welcome-logo"
       width="360" height="391" />

  <a href="home.html" class="welcome-cta">Enter</a>

</body>
</html>
